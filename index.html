<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CV y LinkedIn</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #000; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: #000;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: min(100%, 320px);
    }
    a { display: block; width: 100%; }
    a:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 6px;
    }
    img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <main aria-label="CV y LinkedIn">
    <a href="CV.pdf" aria-label="Ver CV">
      <img src="cv.png" alt="CV">
    </a>
    <!-- Sustituye esta URL por la de tu perfil de LinkedIn. -->
    <a href="https://www.linkedin.com/in/hugoi-/"
       aria-label="Ver perfil de LinkedIn">
      <img src="linkedin.png" alt="LinkedIn">
    </a>
  </main>
</body>
</html>
